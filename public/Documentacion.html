<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Documentación de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; margin: 0; }
            pre, .mermaid { background: white !important; break-inside: avoid; }
            svg { background: white !important; }
            .page-break { page-break-after: always; }
        }
        body { font-family: sans-serif; padding: 2rem; background: #f3f4f6; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 3rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
        h1, h2, h3 { color: #1f2937; margin-top: 2rem; margin-bottom: 1rem; font-weight: bold; }
        h1 { font-size: 2.25rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; }
        h2 { font-size: 1.5rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.25rem; }
        p, li { color: #4b5563; line-height: 1.6; margin-bottom: 0.5rem; }
        ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .mermaid-wrapper { background: white; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 2rem; display: flex; justify-content: center;}
        hr { margin: 2rem 0; border: none; border-top: 1px solid #e5e7eb; }
        code { background: #f3f4f6; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; }
        pre code { background: none; }
    </style>
</head>
<body>
    <div class="no-print text-center mb-6">
        <button onclick="window.print()" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 font-bold text-lg">🖨️ Exportar a PDF (Imprimir)</button>
        <p class="text-sm text-gray-500 mt-2">En la ventana de impresión, selecciona "Guardar como PDF".</p>
    </div>
    <div class="container" id="content"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        // Forzar fondo blanco y tema claro
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            themeVariables: {
                darkMode: false,
                background: '#ffffff'
            }
        });

        // Cargar el markdown codificado desde PHP
        const markdownContent = "# Documentaci\u00f3n del M\u00f3dulo: Control de Inventario\n\nEsta documentaci\u00f3n detalla el funcionamiento, estructura y flujo de eventos del m\u00f3dulo de **Inventario** dentro del sistema VectorLab.\n\n---\n\n## 1. Arquitectura General\n\nEl m\u00f3dulo sigue una arquitectura reactiva e h\u00edbrida combinando:\n- **Backend Reactivo:** Laravel Livewire (`Inventario.php`) para manejar el estado del servidor, b\u00fasquedas, filtrados y persistencia en base de datos.\n- **Frontend de Renderizado:** Laravel Blade (`inventario.blade.php`) para el layout principal y la reactividad de la tabla.\n- **Frontend Interactivo:** Vanilla JavaScript + SweetAlert2 (`inventario.js` y `proveedores.js`) para manejar modales complejos, eventos de teclado y flujos as\u00edncronos sin recargar la p\u00e1gina.\n\n---\n\n## 2. Backend (Livewire Component: `Inventario.php`)\n\n### Variables de Estado (Properties)\n- `$search`: Texto de b\u00fasqueda (filtra por nombre o c\u00f3digo).\n- `$filterProveedor`: ID del proveedor seleccionado para filtrar la tabla.\n- `$filterFaltantes`: Booleano para mostrar \u00fanicamente productos con `stock \u003C= stock_minimo`.\n- `$selectedProductos`: Array con los IDs de productos seleccionados mediante los checkboxes.\n- `$selectAll`: Booleano que indica si todos los productos visibles est\u00e1n seleccionados.\n\n### Listeners Globales (`#[On(\u0027...\u0027)]`)\nLivewire \u0022escucha\u0022 estos eventos emitidos desde el Frontend (JS) para ejecutar acciones en el servidor:\n- `clearSelection`: Limpia los checkboxes seleccionados (desencadenado por la tecla `Escape`).\n- `guardarProveedor`: Recibe los datos del modal de \u0022Nuevo Proveedor\u0022 y crea o actualiza el registro en la tabla `proveedores`.\n- `crearCategoria` \/ `actualizarCategoria` \/ `eliminarCategoria`: Gestiona el CRUD de categor\u00edas en la base de datos. Al eliminar, los productos asignados a la categor\u00eda eliminada pasan a categor\u00eda `null` (Ninguna \/ General).\n- `actualizarStock`: Suma piezas al stock actual de un producto y recalcula (ej. cajas * piezas + unidades).\n- `exportSelected`, `sendPdfEmail`, `sendPdfWhatsApp`: Gestionan las opciones del submen\u00fa de exportaci\u00f3n de PDF.\n\n---\n\n## 3. Frontend Principal (`inventario.blade.php`)\n\n- **Controles Superiores:** Contiene los botones principales de *Exportar a PDF*, *Categor\u00edas* (abre el Gestor Unificado), *Nuevo Proveedor* y *Nuevo Producto*.\n- **Filtros en tiempo real:** Usan `wire:model.live` para hacer la petici\u00f3n a Livewire autom\u00e1ticamente mientras el usuario teclea o selecciona, sin botones de \u0022Buscar\u0022.\n- **Tabla de Inventario:** Renderiza las columnas: Checkbox, C\u00f3digo, Producto, Categor\u00eda, Proveedor, Costo, P. Venta, P. Mayoreo, Stock, Stock Min., y Acciones (Editar\/Eliminar\/Ingresar).\n- **Inyecci\u00f3n de JS:** Al final del archivo se inyectan variables PHP directamente a JS para usarlas en modales flotantes:\n  ```html\n  \u003Cscript\u003E\n      window.inventarioProveedores = @json($proveedores);\n      window.inventarioCategorias = @json($categorias);\n  \u003C\/script\u003E\n  ```\n  Esto permite que JS reconstruya men\u00fas desplegables (`\u003Cselect\u003E`) sin tener que consultar de nuevo a la base de datos cada vez que se abre un modal.\n\n---\n\n## 4. Javascript y Modales (`inventario.js`)\n\nEl archivo `inventario.js` centraliza las interacciones que requieren ventanas flotantes (SweetAlert2) y manipulaci\u00f3n del DOM.\n\n### 4.1. Gestor Unificado de Categor\u00edas\n- **Apertura:** `abrirGestorCategorias()` crea (si no existe) y muestra un modal HTML puro (`#modal_gestor_categorias`) con `z-index: 1050`.\n- **Formulario Integrado:** En la parte superior del Gestor est\u00e1 el input `#nueva_categoria_inline`.\n  - Al dar clic en \u0022Guardar\u0022 o al presionar `Enter` (`onkeydown`), se invoca `guardarNuevaCategoriaInline()`, lo cual despacha el evento a Livewire y luego invoca `cerrarGestorCategorias()`.\n- **Navegaci\u00f3n por Teclado:** \n  - `navegarTecladoCategorias(dir)`: Usa `ArrowUp` y `ArrowDown` para mover el foco (`focus()`) a trav\u00e9s de la lista de categor\u00edas.\n  - Al presionar `Enter` sobre una categor\u00eda, se emite `seleccionarCategoria()`.\n- **Botones de la Lista:** Tienen funciones `editarCategoriaModal` y `eliminarCategoriaModal` que abren modales secundarios de confirmaci\u00f3n y despachan eventos a Livewire.\n\n### 4.2. Gestor de Productos\n- **`nuevoProducto()` \/ `editarProducto()`:** Construyen un modal inmenso divido en dos secciones (Informaci\u00f3n B\u00e1sica e Inventario\/Precios).\n  - Usan funciones auxiliares como `generarHtmlProveedores()` y `generarHtmlCategorias()` para imprimir los combos (selects) usando los arrays inyectados de Laravel.\n  - Al \u0022Continuar\u0022, ejecuta la funci\u00f3n `preConfirm` que recolecta el valor de todos los `input` y valida que los campos obligatorios (nombre, c\u00f3digo) est\u00e9n llenos. Luego despacha `guardarProducto` al backend.\n  - **Bot\u00f3n Integrado:** Junto al combobox de proveedores est\u00e1 el bot\u00f3n `+` que llama a `nuevoProveedor()` (funci\u00f3n heredada de `proveedores.js`) para que un usuario registre proveedores sin salir del flujo.\n- **Validaci\u00f3n Autom\u00e1tica:** Los inputs tienen eventos como `oninput=\u0022this.value = this.value.toUpperCase()\u0022` para mantener consistencia.\n\n### 4.3. Ingreso R\u00e1pido de Mercanc\u00eda\n- **`entradaProducto()`:** Abre un modal para calcular \u0022Piezas a Ingresar\u0022. \n- **L\u00f3gica de Conversi\u00f3n:** Muestra diferentes campos dependiendo del `ingreso_tipo_default` del producto:\n  - **Unidades Sueltas:** Solo pide piezas.\n  - **Por Paquetes:** Pide cantidad de paquetes y cu\u00e1ntas unidades trae cada paquete.\n  - **Por Cajas:** Pide cantidad de cajas, paquetes por caja y unidades por paquete.\n- **Evento Din\u00e1mico:** `calcularTotalIngreso(tipo)` se ejecuta al vuelo (`oninput`) para ir multiplicando y mostrar el total de piezas nuevas y la proyecci\u00f3n de c\u00f3mo quedar\u00e1 el Stock Final, antes de darle a Guardar.\n\n---\n\n## 5. Ciclo de Vida y Eventos Completos (Frontend \u003C-\u003E Backend)\n\nEl ciclo de comunicaci\u00f3n casi siempre sigue este flujo:\n\n1. **Usuario hace una acci\u00f3n:** (Ej. Clic en \u0022Guardar\u0022).\n2. **JS recolecta y valida:** Se dispara una funci\u00f3n en `inventario.js` (Ej. `preConfirm` de un Swal).\n3. **Despacho a Livewire:** Se invoca `Livewire.dispatch(\u0027eventoBackend\u0027, [datos])`.\n4. **Ejecuci\u00f3n PHP:** El archivo `Inventario.php` atrapa el evento mediante un atributo (`#[On(\u0027eventoBackend\u0027)]`), hace validaciones, procesa en base de datos (Modelo Eloquent) y actualiza sus variables.\n5. **Aviso de Retorno a JS:** Si todo sali\u00f3 bien, Livewire despacha un aviso de regreso usando `$this-\u003Edispatch(\u0027swal:success\u0027, [\u0027title\u0027=\u003E\u0027\u00c9xito\u0027, ...])`.\n6. **Alerta y Re-Render:** Un `window.addEventListener(\u0027swal:success\u0027, ...)` en `inventario.js` (o global) atrapa este aviso y muestra la palomita verde de SweetAlert. Paralelamente, Livewire recarga (re-renderiza) la tabla HTML principal y el script en inyecci\u00f3n de `@json` con los datos actualizados.\n\n---\n\n## 6. Lista R\u00e1pida de Archivos del M\u00f3dulo\n- `app\/Livewire\/Inventario.php` (L\u00f3gica central, Consultas a BD).\n- `resources\/views\/livewire\/inventario.blade.php` (Vista de la tabla principal y botones).\n- `public\/js\/inventario.js` (L\u00f3gica UI de modales, c\u00e1lculos e interactividad).\n- `public\/css\/inventario.css` (Estilos personalizados).\n- `app\/Models\/Producto.php`, `Categoria.php`, `Proveedor.php` (Modelos Eloquent de base de datos).\n- `public\/js\/proveedores.js` (L\u00f3gica inyectada al Inventario para que pueda registrar proveedores con la ventana principal completa).\n\n\n\u003Cdiv style=\u0027page-break-after: always;\u0027\u003E\u003C\/div\u003E\n\n# Diagramas de Flujo: M\u00f3dulo de Inventario (Seccionado)\n\nPara que puedas visualizar cada parte con mucho mayor tama\u00f1o y detalle, he dividido el flujo general en las \u00e1reas principales del m\u00f3dulo. \n\n---\n\n## 1. Men\u00fa Principal\nEste es el punto de partida donde decides qu\u00e9 acci\u00f3n realizar.\n\n```mermaid\nflowchart TD\n    Inicio([Entrada al M\u00f3dulo de Inventario]) --\u003E MenuPrincipal{\u00bfQu\u00e9 deseas hacer?}\n    \n    MenuPrincipal --\u003E|Buscar| Busqueda[Ir a Secci\u00f3n B\u00fasqueda y Filtros]\n    MenuPrincipal --\u003E|Organizar| Cat[Ir a Gesti\u00f3n de Categor\u00edas]\n    MenuPrincipal --\u003E|Nuevo Contacto| Prov[Ir a Gesti\u00f3n de Proveedores]\n    MenuPrincipal --\u003E|A\u00f1adir Art\u00edculo| Prod[Ir a Gesti\u00f3n de Productos]\n    MenuPrincipal --\u003E|Modificar Art\u00edculo| Acciones[Ir a Acciones en la Tabla]\n    MenuPrincipal --\u003E|Reportes| Exportar[Ir a Exportaci\u00f3n PDF]\n```\n\n---\n\n## 2. B\u00fasqueda y Filtros\nC\u00f3mo el usuario encuentra la informaci\u00f3n en la tabla de forma din\u00e1mica.\n\n```mermaid\nflowchart TD\n    Busqueda([Secci\u00f3n B\u00fasqueda y Filtros]) --\u003E AccionUsuario{Selecciona una opci\u00f3n}\n    \n    AccionUsuario --\u003E|Caja de Texto| Filtro1[Escribir Nombre o C\u00f3digo]\n    AccionUsuario --\u003E|Selector Desplegable| Filtro2[Elegir Proveedor Espec\u00edfico]\n    AccionUsuario --\u003E|Bot\u00f3n Naranja\/Gris| Filtro3[Clic en \u0027Ver Faltantes\u0027]\n    \n    Filtro1 \u0026 Filtro2 \u0026 Filtro3 --\u003E Actualizacion[La tabla se actualiza autom\u00e1ticamente al instante]\n```\n\n---\n\n## 3. Gesti\u00f3n de Categor\u00edas\nEl flujo unificado para administrar y crear categor\u00edas.\n\n```mermaid\nflowchart TD\n    Cat([Gesti\u00f3n de Categor\u00edas]) --\u003E ClicCat[Clic en bot\u00f3n \u0027Categor\u00edas\u0027]\n    ClicCat --\u003E GestorCat[Abre Ventana del Gestor Unificado]\n    \n    GestorCat --\u003E AccionCat{\u00bfQu\u00e9 hacer en la ventana?}\n    \n    AccionCat --\u003E|Nueva| NuevaCat[Escribir en la barra superior]\n    NuevaCat --\u003E GuardarCat[Presionar Enter o clic en \u0027Guardar\u0027]\n    GuardarCat --\u003E CierreExito[Ventana se cierra y muestra \u0027\u00c9xito\u0027]\n    \n    AccionCat --\u003E|Modificar| EditCat[Clic en icono L\u00e1piz]\n    EditCat --\u003E EscribirEdicion[Cambiar nombre y Actualizar]\n    \n    AccionCat --\u003E|Borrar| ElimCat[Clic en icono Basura]\n    ElimCat --\u003E ConfirmElim[Confirmar eliminaci\u00f3n irreversible]\n```\n\n---\n\n## 4. Gesti\u00f3n de Proveedores\nC\u00f3mo se a\u00f1aden nuevos proveedores sin salir del inventario.\n\n```mermaid\nflowchart TD\n    Prov([Gesti\u00f3n de Proveedores]) --\u003E ClicProv[Clic en \u0027Nuevo Proveedor\u0027 o icono \u0027+\u0027]\n    ClicProv --\u003E FormProv[Se abre ventana flotante ancha]\n    \n    FormProv --\u003E LlenarProv[Ingresar Datos]\n    LlenarProv --\u003E DatosGen[Nombre, Correo, Tel\u00e9fono, RFC]\n    LlenarProv --\u003E DatosBan[Banco, Cuenta, CLABE, Titular]\n    \n    DatosGen \u0026 DatosBan --\u003E BotonGuardar[Clic en \u0027Guardar\u0027]\n    BotonGuardar --\u003E FinProv[Proveedor guardado en cat\u00e1logo general de VectorLab]\n```\n\n---\n\n## 5. Creaci\u00f3n y Edici\u00f3n de Productos\nEl flujo para agregar mercanc\u00eda nueva al cat\u00e1logo o corregir informaci\u00f3n.\n\n```mermaid\nflowchart TD\n    Prod([Gesti\u00f3n de Productos]) --\u003E Origen{Crear o Editar?}\n    \n    Origen --\u003E|Crear| NuevoProd[Clic en bot\u00f3n \u0027Nuevo Producto\u0027]\n    Origen --\u003E|Editar| EditarProd[Clic en icono L\u00e1piz en la tabla]\n    \n    NuevoProd \u0026 EditarProd --\u003E FormProd[Abre Formulario Principal]\n    \n    FormProd --\u003E Seccion1[Info B\u00e1sica: Nombre, C\u00f3digo, Categor\u00eda, Proveedor]\n    FormProd --\u003E Seccion2[Precios: Costo, P. Venta, P. Mayoreo]\n    FormProd --\u003E Seccion3[Stock: Tipo de Ingreso y Cantidades Base]\n    \n    Seccion1 \u0026 Seccion2 \u0026 Seccion3 --\u003E Validacion{Faltan datos obligatorios?}\n    Validacion --\u003E|S\u00ed| Error[Muestra alerta roja pidiendo datos]\n    Validacion --\u003E|No| Guardar[Clic en Continuar -\u003E Producto Guardado]\n```\n\n---\n\n## 6. Ingreso de Mercanc\u00eda (Stock)\nEl proceso matem\u00e1tico y visual para surtir un producto.\n\n```mermaid\nflowchart TD\n    Stock([Ingresar Mercanc\u00eda]) --\u003E ClicIngresar[Escribir en la celda \u0027Ingreso\u0027 y dar Enter]\n    ClicIngresar --\u003E ModoSurtir[Abre ventana de surtido r\u00e1pido]\n    \n    ModoSurtir --\u003E ElegirSurtido{\u00bfTipo de Producto?}\n    \n    ElegirSurtido --\u003E|Suelto| SumaUni[Pide Cantidad de Unidades Simples]\n    ElegirSurtido --\u003E|Por Paquete| SumaPaq[Pide Cant. Paquetes y Piezas x Paquete]\n    ElegirSurtido --\u003E|Por Caja| SumaCaj[Pide Cajas, Paq. x Caja y Piezas x Paquete]\n    \n    SumaUni --\u003E|Suma directa| Proyeccion\n    SumaPaq --\u003E|Multiplica Paquetes * Piezas| Proyeccion\n    SumaCaj --\u003E|Multiplica Cajas * Paq * Piezas| Proyeccion\n    \n    Proyeccion[Muestra previsualizaci\u00f3n de \u0027Nuevas Piezas\u0027 y \u0027Stock Final\u0027]\n    Proyeccion --\u003E ConfirmarSurtido[Clic en Confirmar]\n    ConfirmarSurtido --\u003E ActualizacionStock[Stock modificado correctamente]\n```\n\n---\n\n## 7. Exportaci\u00f3n a PDF\nC\u00f3mo llevar la tabla digital a un documento imprimible o enviarlo a clientes.\n\n```mermaid\nflowchart TD\n    Exp([Exportaci\u00f3n a PDF]) --\u003E Marcar[Marcar casillas de los productos deseados en la tabla]\n    Marcar --\u003E ClicExp[Clic en \u0027Exportar a PDF\u0027]\n    ClicExp --\u003E OpcionesPDF{Opciones de Env\u00edo}\n    \n    OpcionesPDF --\u003E|Opci\u00f3n 1| Imprimir[Generar archivo para descargar o imprimir]\n    OpcionesPDF --\u003E|Opci\u00f3n 2| EnviarEmail[Escribir correo y enviarlo directo]\n    OpcionesPDF --\u003E|Opci\u00f3n 3| EnviarWhats[Escribir tel\u00e9fono, abre Web WhatsApp con mensaje y enlace\/PDF]\n```\n";

        // Render markdown
        document.getElementById('content').innerHTML = marked.parse(markdownContent);
        
        // Extraer y procesar diagramas
        const codeBlocks = document.querySelectorAll('code.language-mermaid');
        codeBlocks.forEach((block, index) => {
            const pre = block.parentElement;
            const container = document.createElement('div');
            container.className = 'mermaid-wrapper';
            container.innerHTML = `<div class="mermaid" id="mermaid-${index}">${block.textContent}</div>`;
            pre.parentNode.replaceChild(container, pre);
        });

        // Renderizar mermaid
        await mermaid.run({
            nodes: document.querySelectorAll('.mermaid'),
        });
        
        // Forzar fondo blanco en los SVGs generados
        document.querySelectorAll('.mermaid svg').forEach(svg => {
            svg.style.backgroundColor = 'white';
        });
    </script>
</body>
</html>
